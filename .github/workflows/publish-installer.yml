name: Publicar instalador do Bin Race 3
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável
        required: true
        type: string
      asset_bundle:
        description: Pacotes autorizados com URLs temporárias, nomes, tamanhos e hashes
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter somente os pacotes e verificar a integridade
        run: |
          python - <<'PY'
          import os,json,re,urllib.request,urllib.parse,hashlib
          inputs=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          version=inputs['version'];bundle=json.loads(inputs['asset_bundle'])
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)',version):raise SystemExit('Versão inválida.')
          if not isinstance(bundle,list) or not 3<=len(bundle)<=8:raise SystemExit('Lista de pacotes inválida.')
          names=set();total=0
          for item in bundle:
            name=item['name'];url=item['url'];print(f'::add-mask::{url}')
            valid=name in (f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt',f'Bin-Race-3-{version}-macOS-universal.dmg','Bin-Race-3-macOS-SHA256SUMS.txt') or re.fullmatch(r'Bin-Race-3-Update-'+re.escape(version)+r'-from-\d+\.\d+\.\d+\.exe',name)
            if not valid or name in names or not re.fullmatch('[a-f0-9]{64}',item['sha256']):raise SystemExit('Nome/hash inválido.')
            names.add(name);size=item['size']
            if not isinstance(size,int) or not 0<size<=2*1024**3:raise SystemExit('Tamanho inválido.')
            total+=size
            if total>8*1024**3:raise SystemExit('Tamanho total inválido.')
            parsed=urllib.parse.urlsplit(url)
            if parsed.scheme!='https' or parsed.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com') or parsed.username or parsed.password:raise SystemExit('Origem não autorizada.')
          if not {f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt'}<=names:raise SystemExit('Faltam arquivos obrigatórios.')
          mac_names={f'Bin-Race-3-{version}-macOS-universal.dmg','Bin-Race-3-macOS-SHA256SUMS.txt'}
          if names & mac_names and not mac_names<=names:raise SystemExit('Faltam pacotes macOS.')
          for item in bundle:
            digest=hashlib.sha256();received=0;prefix=b''
            try:
              with urllib.request.urlopen(item['url'],timeout=60) as response,open(item['name'],'wb') as output:
                final=urllib.parse.urlsplit(response.geturl())
                if final.scheme!='https' or final.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com'):raise ValueError('Origem final inválida.')
                while True:
                  chunk=response.read(1024*1024)
                  if not chunk:break
                  received+=len(chunk)
                  if received>item['size']:raise ValueError('Tamanho excedido.')
                  if len(prefix)<2:prefix=(prefix+chunk)[:2]
                  output.write(chunk);digest.update(chunk)
            except Exception:raise SystemExit('Falha no download temporário. Gere nova publicação.')
            if received!=item['size'] or digest.hexdigest()!=item['sha256'] or (item['name'].endswith('.exe') and prefix!=b'MZ'):raise SystemExit('Integridade inválida.')
            print(f"Verificado: {item['name']}, {received} bytes.")
          sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in open('Bin-Race-3-SHA256SUMS.txt').read().splitlines()}
          if sums!={item['name']:item['sha256'] for item in bundle if item['name']!='Bin-Race-3-SHA256SUMS.txt' and item['name'] not in mac_names}:raise SystemExit('Inventário Windows divergente.')
          if mac_names<=names:
            mac_sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in open('Bin-Race-3-macOS-SHA256SUMS.txt').read().splitlines()}
            if mac_sums!={item['name']:item['sha256'] for item in bundle if item['name'] in mac_names and item['name'].endswith('.dmg')}:raise SystemExit('Inventário macOS divergente.')
          with open('publish-files.json','w') as f:json.dump([item['name'] for item in bundle],f)
          PY
      - name: Publicar arquivos de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          # Bin Race 3 __VERSION__ — diagnóstico USB do SOLO 1
          
          O painel do SOLO 1 explica os principais erros de driver do Windows e oferece
          um relatório selecionável para suporte sem número de série, nomes do computador
          ou caminhos pessoais. A consulta permite até 30 segundos para a inicialização
          dos serviços do Windows e informa quando é necessário tentar novamente.
          
          Uma nova consulta ou troca de modelo remove o resultado anterior. Escape não
          fecha a janela enquanto a consulta USB ou a abertura do Race Studio está em
          andamento. Os atalhos do Race Studio 2 e 3 aguardam operações Wi-Fi pendentes,
          inclusive a escolha da pasta para salvar os arquivos.
          
          **O download USB direto do SOLO 1 ainda não está implementado.** O caminho
          disponível continua sendo baixar pelo Race Studio 2 e importar o DRK com os
          auxiliares do mesmo treino; o RRK fornece GPS na variante validada. Detectar um
          candidato USB não confirma o modelo nem a comunicação com o aparelho.
          
          A preparação de desenvolvimento inclui guia de coleta remota, diagnóstico
          PowerShell e ferramentas para analisar/reproduzir capturas USBPcap. Elas não
          enviam comandos ao aparelho nem substituem o protocolo de download ainda pendente.
          
          Mantém importação e biblioteca local, relatórios, replay, análise e atualização.
          Sem backup automático ou restauração de biblioteca. Não altera os treinos,
          originais em Tracks nem as preferências existentes. O site mantém sua versão.
          
          O foco de distribuição passa a ser **Windows instalado e navegador**.
          No iPhone, celular ou MacBook, acesse o site público pelo Safari, Chrome ou
          outro navegador compatível: https://binrace3.cleandog263.chatgpt.site
          Não é necessário instalar um aplicativo Mac nativo para usar essa versão web.
          Não há novo instalador Mac nesta entrega; as versões Mac antigas permanecem
          no histórico. Conexão direta com aparelhos é uma função do aplicativo Windows;
          o site abre arquivos já baixados. A assinatura Windows mantém os limites já
          documentados.
          NOTES
          sed -i "s/__VERSION__/$APP_VERSION/g" notes.md

          mapfile -t release_files < <(python -c 'import json; print("\n".join(json.load(open("publish-files.json"))))')
          gh release create "v$APP_VERSION" "${release_files[@]}" --repo "$GH_REPO" --title "Bin Race 3 $APP_VERSION" --notes-file notes.md
