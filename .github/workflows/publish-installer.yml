name: Publicar instalador do Bin Race 3
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável
        required: true
        type: string
      asset_bundle:
        description: Pacotes autorizados com URLs temporárias, nomes, tamanhos e hashes
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter somente os pacotes e verificar a integridade
        run: |
          python - <<'PY'
          import os,json,re,urllib.request,urllib.parse,hashlib
          inputs=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          version=inputs['version'];bundle=json.loads(inputs['asset_bundle'])
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)',version):raise SystemExit('Versão inválida.')
          if not isinstance(bundle,list) or not 3<=len(bundle)<=6:raise SystemExit('Lista de pacotes inválida.')
          names=set();total=0
          for item in bundle:
            name=item['name'];url=item['url'];print(f'::add-mask::{url}')
            valid=name in (f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt') or re.fullmatch(r'Bin-Race-3-Update-'+re.escape(version)+r'-from-\d+\.\d+\.\d+\.exe',name)
            if not valid or name in names or not re.fullmatch('[a-f0-9]{64}',item['sha256']):raise SystemExit('Nome/hash inválido.')
            names.add(name);size=item['size']
            if not isinstance(size,int) or not 0<size<=2*1024**3:raise SystemExit('Tamanho inválido.')
            total+=size
            if total>8*1024**3:raise SystemExit('Tamanho total inválido.')
            parsed=urllib.parse.urlsplit(url)
            if parsed.scheme!='https' or parsed.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com') or parsed.username or parsed.password:raise SystemExit('Origem não autorizada.')
          if not {f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt'}<=names:raise SystemExit('Faltam arquivos obrigatórios.')
          for item in bundle:
            digest=hashlib.sha256();received=0;prefix=b''
            try:
              with urllib.request.urlopen(item['url'],timeout=60) as response,open(item['name'],'wb') as output:
                final=urllib.parse.urlsplit(response.geturl())
                if final.scheme!='https' or final.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com'):raise ValueError('Origem final inválida.')
                while True:
                  chunk=response.read(1024*1024)
                  if not chunk:break
                  received+=len(chunk)
                  if received>item['size']:raise ValueError('Tamanho excedido.')
                  if len(prefix)<2:prefix=(prefix+chunk)[:2]
                  output.write(chunk);digest.update(chunk)
            except Exception:raise SystemExit('Falha no download temporário. Gere nova publicação.')
            if received!=item['size'] or digest.hexdigest()!=item['sha256'] or (item['name'].endswith('.exe') and prefix!=b'MZ'):raise SystemExit('Integridade inválida.')
            print(f"Verificado: {item['name']}, {received} bytes.")
          sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in open('Bin-Race-3-SHA256SUMS.txt').read().splitlines()}
          if sums!={item['name']:item['sha256'] for item in bundle if item['name']!='Bin-Race-3-SHA256SUMS.txt'}:raise SystemExit('Inventário de hashes divergente.')
          PY
      - name: Publicar arquivos de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Bin Race 3 0.9.0 — diagnóstico de validade do tempo.

          Nova aba lateral Validade do tempo. Selecione a sessão e a volta no topo, escolha examinar essa volta ou todas da sessão e clique em Verificar tempo. O relatório só é gerado mediante essa ação; mudar os parâmetros invalida o resultado anterior.

          Verificações dos dados importados: relógio, intervalos/cobertura, saltos de posição versus velocidade, coordenadas repetidas com velocidade, variações abruptas de velocidade, precisão/satélites quando presentes, coerência de marcos e transição entre voltas. Compara a distância geométrica reamostrada à integral da velocidade, deixando claro que são canais do mesmo GPS e não instrumentos independentes.

          Referência confiável opcional, escolhida manualmente. Com qualidade suficiente: compara afastamentos sustentados do trajeto, possíveis encurtamentos e marcos de largada/chegada relativos à linha inferida do GPS da referência. Mostra tolerâncias usadas e cruzamentos internos da linha. Falhas GPS não são transformadas automaticamente em corte de pista; referência defeituosa suspende a comparação geométrica.

          Resultados: Anomalias para revisar, Dados insuficientes ou Sem alerta nos testes executados. Cada achado apresenta intervalo, evidência, pontos no mapa e amostras próximas. Setores afetados são destacados no mapa e filtram os achados; a divisão respeita a referência e os setores revisados disponíveis. Lacunas usam os extremos para indicar região, sem inventar o trajeto desconhecido. Falhas globais abrangem toda a volta; ausência de base fica sem localização. PDF inclui setor/alcance e exporta a volta aberta, referência, verificações, achados e limites. Na análise de sessão inteira, cada volta tem seu próprio resultado, e PDF da sessão reúne os resultados e achados por volta/setor.

          Não é certificado de tempo válido, autenticidade ou prova de fraude/intenção. Sem alertas não garante ausência de corte. Não há limites físicos oficiais nem linha oficial cadastrados; a linha de referência é inferida de outra volta. Amostras e marcos podem depender de interpolação/importação. Conteúdo recusado pelo leitor ou não decodificado não é recuperado nesta aba. Nenhum tempo é corrigido ou excluído.

          Mantém a correção 0.8.1: zoom livre por lupas/roda, arrastar e Pista inteira no próprio mapa durante o Play, preservando relógio e reprodução. Editor de setores continua acima do mapa. Biblioteca, ideal, vídeo, rolling, backup/PDF e atualização incremental preservados. Código e telemetria privados; sem certificado público novo.

          Para a primeira instalação, baixe Bin-Race-3-Setup-0.9.0.exe. Pacotes Update são usados pelo aplicativo; o catálogo JSON não é um instalador. Código-fonte e arquivos de telemetria permanecem privados.
          NOTES
          gh release create "v$APP_VERSION" Bin-Race-3-*.exe Bin-Race-3-Update-*.json Bin-Race-3-SHA256SUMS.txt --repo "$GH_REPO" --title "Bin Race 3 $APP_VERSION" --notes-file notes.md
