name: Publicar instalador do Bin Race 3
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável
        required: true
        type: string
      asset_bundle:
        description: Pacotes autorizados com URLs temporárias, nomes, tamanhos e hashes
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter somente os pacotes e verificar a integridade
        run: |
          python - <<'PY'
          import os,json,re,urllib.request,urllib.parse,hashlib
          inputs=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          version=inputs['version'];bundle=json.loads(inputs['asset_bundle'])
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)',version):raise SystemExit('Versão inválida.')
          if not isinstance(bundle,list) or not 3<=len(bundle)<=8:raise SystemExit('Lista de pacotes inválida.')
          names=set();total=0
          for item in bundle:
            name=item['name'];url=item['url'];print(f'::add-mask::{url}')
            valid=name in (f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt',f'Bin-Race-3-{version}-macOS-universal.dmg','Bin-Race-3-macOS-SHA256SUMS.txt') or re.fullmatch(r'Bin-Race-3-Update-'+re.escape(version)+r'-from-\d+\.\d+\.\d+\.exe',name)
            if not valid or name in names or not re.fullmatch('[a-f0-9]{64}',item['sha256']):raise SystemExit('Nome/hash inválido.')
            names.add(name);size=item['size']
            if not isinstance(size,int) or not 0<size<=2*1024**3:raise SystemExit('Tamanho inválido.')
            total+=size
            if total>8*1024**3:raise SystemExit('Tamanho total inválido.')
            parsed=urllib.parse.urlsplit(url)
            if parsed.scheme!='https' or parsed.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com') or parsed.username or parsed.password:raise SystemExit('Origem não autorizada.')
          if not {f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt'}<=names:raise SystemExit('Faltam arquivos obrigatórios.')
          mac_names={f'Bin-Race-3-{version}-macOS-universal.dmg','Bin-Race-3-macOS-SHA256SUMS.txt'}
          if names & mac_names and not mac_names<=names:raise SystemExit('Faltam pacotes macOS.')
          for item in bundle:
            digest=hashlib.sha256();received=0;prefix=b''
            try:
              with urllib.request.urlopen(item['url'],timeout=60) as response,open(item['name'],'wb') as output:
                final=urllib.parse.urlsplit(response.geturl())
                if final.scheme!='https' or final.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com'):raise ValueError('Origem final inválida.')
                while True:
                  chunk=response.read(1024*1024)
                  if not chunk:break
                  received+=len(chunk)
                  if received>item['size']:raise ValueError('Tamanho excedido.')
                  if len(prefix)<2:prefix=(prefix+chunk)[:2]
                  output.write(chunk);digest.update(chunk)
            except Exception:raise SystemExit('Falha no download temporário. Gere nova publicação.')
            if received!=item['size'] or digest.hexdigest()!=item['sha256'] or (item['name'].endswith('.exe') and prefix!=b'MZ'):raise SystemExit('Integridade inválida.')
            print(f"Verificado: {item['name']}, {received} bytes.")
          sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in open('Bin-Race-3-SHA256SUMS.txt').read().splitlines()}
          if sums!={item['name']:item['sha256'] for item in bundle if item['name']!='Bin-Race-3-SHA256SUMS.txt' and item['name'] not in mac_names}:raise SystemExit('Inventário Windows divergente.')
          if mac_names<=names:
            mac_sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in open('Bin-Race-3-macOS-SHA256SUMS.txt').read().splitlines()}
            if mac_sums!={item['name']:item['sha256'] for item in bundle if item['name'] in mac_names and item['name'].endswith('.dmg')}:raise SystemExit('Inventário macOS divergente.')
          PY
      - name: Publicar arquivos de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Bin Race 3 0.11.1 — revisão Wi-Fi e atualização automática no Mac.

          **Downloads separados:** Windows 10/11 x64 usa Bin-Race-3-Setup-0.11.1.exe. Mac Intel e chip Apple usam o mesmo Bin-Race-3-0.11.1-macOS-universal.dmg; ele contém somente versões Mac, sem Windows. O sistema escolhe a arquitetura nativa. Mac requer macOS 12 ou posterior, com ensaios desta edição no macOS 15 nos dois processadores. Não exige GitHub, Codex, Node.js ou login no programa.

          **Wi-Fi revisado:** seleção de Conexão do computador para situações com VPN/cabo/vários adaptadores; preferência pela sub-rede mais específica e escolha explícita em empate. Erros no envio UDP e depois do bind passam à operação; não são tratados como ausência de aparelho ou download concluído. Timeout TCP rejeita sem depender do fechamento pelo sistema. Mac abre configurações compatíveis com Monterey e sistemas novos. Permissões/rede/firewall têm orientação; nenhuma proteção é desativada.

          Testes usam módulos do aplicativo empacotado com sockets UDP/TCP nativos e SOLO virtual no mesmo host, com endpoints/portas remapeados. Conferem descoberta, cache/lista UTF16, download por blocos, conteúdo/hash, importação XRK, corrupção, cancelamento e preservação de arquivos. Isso NÃO é ensaio de rádio, broadcast físico, firmware ou consentimento TCC do SOLO real. Descoberta/download físicos foram confirmados por usuário apenas no Windows. O Wi-Fi Mac continua experimental até teste com aparelho.

          **Mac automático:** após aceitar, baixa/verifica DMG completo, prepara cópia antes de fechar, confere identidade/versão/assinatura técnica, aguarda auxiliar, substitui com backup e reabre via LaunchServices. A nova janela confirma abertura; falha de lançamento tenta restaurar/reabrir a versão anterior. Biblioteca/Tracks ficam fora do app. Sem permissão para escrever na pasta ou se aberto do DMG, mantém o programa aberto e orienta instalação manual. Não altera Gatekeeper/quarentena/firewall nem usa elevação de privilégio. Sem Developer ID/notarização, o sistema ainda pode pedir aprovação ou bloquear; assinatura técnica ad-hoc não identifica editor verificado. Mac ainda baixa pacote completo, sem delta.

          **Transição:** quem usa Mac 0.11.0 precisa instalar 0.11.1 uma vez pelo Finder para adquirir o mecanismo automático. No Windows, o atualizador existente instala normalmente, com pacote parcial quando compatível. Ambos verificam ao abrir ou pelo botão; mudanças só chegam após publicação, sem notificação instantânea enquanto o app permanece aberto.

          Mantém análises/seleção manual, replay/zoom/setores, ideal/metas, biblioteca/backup, relatórios/PDF/vídeo e validade da 0.11.0. Tempos originais preservados; diagnósticos não certificam tempo, autenticidade ou fraude. Extração direta SOLO 1 USB e envio direto de pistas/configurações continuam pendentes. PnP USB/atalhos Race Studio são exclusivos Windows. DRK compatível precisa do RRK correspondente para geometria GPS.

          Para primeira instalação, abra o Setup Windows ou arraste o app do DMG Mac para Aplicativos, ejete e abra pelo local instalado. Pacotes Update, catálogo e SHA são apoio ao atualizador Windows. Código de desenvolvimento permanece privado; runtime distribuído pode ser examinado. Dados pessoais não são publicados.
          NOTES
          gh release create "v$APP_VERSION" Bin-Race-3-*.exe Bin-Race-3-*.dmg Bin-Race-3-Update-*.json Bin-Race-3-SHA256SUMS.txt Bin-Race-3-macOS-SHA256SUMS.txt --repo "$GH_REPO" --title "Bin Race 3 $APP_VERSION" --notes-file notes.md
