name: Publicar instalador do Bin Race 3
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável do aplicativo
        required: true
        type: string
      installer_url:
        description: URL temporária de download do instalador já gerado
        required: true
        type: string
      sha256:
        description: SHA-256 esperado do instalador
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter somente o instalador e conferir a integridade
        env:
          APP_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          python - <<'PY'
          import os,re,urllib.request,urllib.parse,hashlib,json
          installer_url=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']['installer_url']
          print(f'::add-mask::{installer_url}')
          version=os.environ['APP_VERSION'];expected=os.environ['EXPECTED_SHA256'].lower()
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)',version):raise SystemExit('Versão inválida.')
          if not re.fullmatch(r'[a-f0-9]{64}',expected):raise SystemExit('SHA-256 inválido.')
          url=urllib.parse.urlsplit(installer_url)
          if url.scheme!='https' or url.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com') or url.username or url.password:raise SystemExit('Origem de download não autorizada.')
          name=f'Bin-Race-3-Setup-{version}.exe';digest=hashlib.sha256();total=0;prefix=b''
          try:
            with urllib.request.urlopen(installer_url,timeout=60) as response,open(name,'wb') as output:
              while True:
                chunk=response.read(65536)
                if not chunk:break
                total+=len(chunk)
                if total>256*1024*1024:raise ValueError('Instalador maior que o permitido.')
                if len(prefix)<2:prefix=(prefix+chunk)[:2]
                output.write(chunk);digest.update(chunk)
          except Exception:raise SystemExit('Falha no download temporário do instalador. Gere uma nova solicitação de publicação.')
          if digest.hexdigest()!=expected or prefix!=b'MZ':raise SystemExit('A integridade do instalador não confere.')
          open('Bin-Race-3-SHA256SUMS.txt','w').write(f'{expected}  {name}\n')
          print(f'Instalador verificado: {name}, {total} bytes. Nenhum código privado ou arquivo de usuário foi obtido.')
          PY
      - name: Publicar arquivos de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Instalador do Bin Race 3 para Windows 10/11 de 64 bits.

          Baixe o arquivo Bin-Race-3-Setup abaixo e siga o assistente em português. Se o aplicativo já estiver instalado, feche-o antes de atualizar. Os treinos e detalhes permanecem no perfil local.

          O código-fonte e os arquivos pessoais permanecem privados. Este canal contém apenas instaladores, hashes de integridade e as instruções de publicação.

          Correção 0.5.1: resolve “Redirect was cancelled” no atualizador Electron. Se o aplicativo antigo não conseguir baixar, feche-o e instale este .exe manualmente uma vez. O perfil e os treinos são preservados. Testes incluem redirecionamento no Electron real e download público no Windows, com verificação de integridade.

          Layout compacto por abas para notebook: replay, gráficos, setores, ideal e detalhe A/B. Seleção de voltas em janela própria; listas extensas têm rolagem interna. A janela inicial respeita o tamanho útil do monitor.

          NOVO: conexão Wi-Fi EXPERIMENTAL com busca, listagem e download para SOLO 2/SOLO 2 DL. Falta validação no aparelho físico do usuário; os testes usam simulador TCP e XRZ real. Para testar: conecte o Windows ao Wi-Fi do aparelho, feche o Race Studio, abra Conectar aparelho e busque e liste os treinos. A inicialização sincroniza o relógio do aparelho com o computador. SOLO original usa USB/RS2; USB direto/DRK e Bluetooth não estão implementados. Outros AiM Wi-Fi são experimentais, sem compatibilidade universal de protocolo ou arquivo.

          SmartScreen: o processo de assinatura foi preparado, mas falta emitir/configurar um certificado público do editor. Esta entrega continua sem essa assinatura e o aviso de aplicativo não reconhecido pode permanecer. Assinatura nova também depende de reputação; não há promessa de remoção imediata do aviso.

          Inclui comparação de múltiplas voltas avulsas em mapa, gráficos e setores, reconhecimento GPS de curvas, gaps por setor e acumulado, volta ideal apenas dos arquivos selecionados manualmente e detalhes editáveis de sessão. Estimativas por GPS não substituem canais de freio/acelerador. Esta versão inicial não possui assinatura digital.

          Acesso direto em Volta ideal e metas, com origem de cada melhor setor. Volta difícil: meta extra mais rápida que a ideal, com percentual ajustável e fórmula explícita. É uma meta escolhida, não previsão de desempenho. Atualizações podem ser baixadas pelo botão do aplicativo a partir da 0.3.0.

          A geração e os testes de instalação, atalhos e desinstalação são executados no Windows do GitHub antes da publicação. Bin-Race-3-SHA256SUMS.txt contém o SHA-256 do instalador.
          NOTES
          gh release create "v$APP_VERSION" "Bin-Race-3-Setup-$APP_VERSION.exe" Bin-Race-3-SHA256SUMS.txt --repo "$GH_REPO" --title "Bin Race 3 $APP_VERSION" --notes-file notes.md
