name: Publicar instalador do Bin Race 3
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável
        required: true
        type: string
      asset_bundle:
        description: Pacotes autorizados com URLs temporárias, nomes, tamanhos e hashes
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter somente os pacotes e verificar a integridade
        run: |
          python - <<'PY'
          import os,json,re,urllib.request,urllib.parse,hashlib
          inputs=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          version=inputs['version'];bundle=json.loads(inputs['asset_bundle'])
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)',version):raise SystemExit('Versão inválida.')
          if not isinstance(bundle,list) or not 3<=len(bundle)<=6:raise SystemExit('Lista de pacotes inválida.')
          names=set();total=0
          for item in bundle:
            name=item['name'];url=item['url'];print(f'::add-mask::{url}')
            valid=name in (f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt') or re.fullmatch(r'Bin-Race-3-Update-'+re.escape(version)+r'-from-\d+\.\d+\.\d+\.exe',name)
            if not valid or name in names or not re.fullmatch('[a-f0-9]{64}',item['sha256']):raise SystemExit('Nome/hash inválido.')
            names.add(name);size=item['size']
            if not isinstance(size,int) or not 0<size<=2*1024**3:raise SystemExit('Tamanho inválido.')
            total+=size
            if total>8*1024**3:raise SystemExit('Tamanho total inválido.')
            parsed=urllib.parse.urlsplit(url)
            if parsed.scheme!='https' or parsed.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com') or parsed.username or parsed.password:raise SystemExit('Origem não autorizada.')
          if not {f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt'}<=names:raise SystemExit('Faltam arquivos obrigatórios.')
          for item in bundle:
            digest=hashlib.sha256();received=0;prefix=b''
            try:
              with urllib.request.urlopen(item['url'],timeout=60) as response,open(item['name'],'wb') as output:
                final=urllib.parse.urlsplit(response.geturl())
                if final.scheme!='https' or final.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com'):raise ValueError('Origem final inválida.')
                while True:
                  chunk=response.read(1024*1024)
                  if not chunk:break
                  received+=len(chunk)
                  if received>item['size']:raise ValueError('Tamanho excedido.')
                  if len(prefix)<2:prefix=(prefix+chunk)[:2]
                  output.write(chunk);digest.update(chunk)
            except Exception:raise SystemExit('Falha no download temporário. Gere nova publicação.')
            if received!=item['size'] or digest.hexdigest()!=item['sha256'] or (item['name'].endswith('.exe') and prefix!=b'MZ'):raise SystemExit('Integridade inválida.')
            print(f"Verificado: {item['name']}, {received} bytes.")
          sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in open('Bin-Race-3-SHA256SUMS.txt').read().splitlines()}
          if sums!={item['name']:item['sha256'] for item in bundle if item['name']!='Bin-Race-3-SHA256SUMS.txt'}:raise SystemExit('Inventário de hashes divergente.')
          PY
      - name: Publicar arquivos de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Bin Race 3 0.8.0 — zoom, setores e ferramentas de treino.

          Zoom por curva/setor no mapa e nos gráficos de velocidade/gap, com limites comuns e extremos interpolados. Mapa de ganhos/perdas por setor entre as voltas A/B: verde A ganha, coral A perde, cinza diferença pequena. Não representa o acumulado.

          Editor simples para renomear, posicionar limites no mapa ou por percentual, dividir/unir, desfazer e restaurar o automático. Aplica somente após revisão; mesma divisão para as voltas alinhadas. A chegada permanece fixa. Edição da ideal respeita a base escolhida e invalida a confirmação e planos anteriores. Setores compostos não recebem eventos de curva inventados.

          Em Replay e setores > Treino: consistência por arquivo (reunir só mediante escolha), média, mediana, desvio padrão populacional, amplitude e percentis; ranking de N melhores voltas e N melhores passagens por setor, com origem e seleção explícita. Mantém seleção avulsa sem limite fixo.

          Rolling lap: melhor janela contínua começando nos limites dos setores, usando final de uma volta + início da seguinte da mesma gravação. Exige ambas marcadas, relógio e GPS contínuos. Inclui as voltas registradas como candidatas; não une arquivos/dias nem melhores setores soltos. Não é um novo recorde oficial nem busca contínua em todos os pontos GPS possíveis.

          Minhas sessões > Backup e restaurar: exporta dados importados, identificação e preferências das sessões marcadas. Verifica SHA-256 e valida registros antes da revisão. Restauração em transação aditiva: cria cópias com IDs novos, sem limpar/substituir sessões existentes. Não inclui os arquivos originais XRK/XRZ nem vídeos. Limite de 256 MB por backup; divida a seleção se necessário.

          PDF nativo no Windows: comparação A/B, ideal confirmada e plano gerado manualmente, com origens, tabelas, observações e limites da análise. Vídeo local MP4 H.264/WebM com alinhamento manual quadro/cursor, reprodução e busca sincronizadas com o mapa. O arquivo é lido em intervalos, sem carregar o vídeo todo na memória. Precisa reabrir o vídeo ao voltar à tela; nome/deslocamento podem ser guardados, sem caminho pessoal no backup.

          Biblioteca, replay multi-voltas, grupos A/B, plano educativo local e atualização incremental permanecem. GPS não mede freio/acelerador nem comprova causa de perda; ideal e meta extra continuam distintas. Código-fonte e telemetria permanecem privados. SOLO 2 Wi-Fi e envio via Race Studio mantidos. Sem certificado público novo; avisos do Windows podem permanecer.

          Para a primeira instalação, baixe Bin-Race-3-Setup-0.8.0.exe. Pacotes Update são usados pelo aplicativo; o catálogo JSON não é um instalador. Código-fonte e arquivos de telemetria permanecem privados.
          NOTES
          gh release create "v$APP_VERSION" Bin-Race-3-*.exe Bin-Race-3-Update-*.json Bin-Race-3-SHA256SUMS.txt --repo "$GH_REPO" --title "Bin Race 3 $APP_VERSION" --notes-file notes.md
