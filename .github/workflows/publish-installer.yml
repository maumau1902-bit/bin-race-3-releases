name: Publicar instalador do Bin Race 3
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão estável
        required: true
        type: string
      asset_bundle:
        description: Pacotes autorizados com URLs temporárias, nomes, tamanhos e hashes
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter somente os pacotes e verificar a integridade
        run: |
          python - <<'PY'
          import os,json,re,urllib.request,urllib.parse,hashlib
          inputs=json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
          version=inputs['version'];bundle=json.loads(inputs['asset_bundle'])
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)',version):raise SystemExit('Versão inválida.')
          if not isinstance(bundle,list) or not 3<=len(bundle)<=6:raise SystemExit('Lista de pacotes inválida.')
          names=set();total=0
          for item in bundle:
            name=item['name'];url=item['url'];print(f'::add-mask::{url}')
            valid=name in (f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt') or re.fullmatch(r'Bin-Race-3-Update-'+re.escape(version)+r'-from-\d+\.\d+\.\d+\.exe',name)
            if not valid or name in names or not re.fullmatch('[a-f0-9]{64}',item['sha256']):raise SystemExit('Nome/hash inválido.')
            names.add(name);size=item['size']
            if not isinstance(size,int) or not 0<size<=2*1024**3:raise SystemExit('Tamanho inválido.')
            total+=size
            if total>8*1024**3:raise SystemExit('Tamanho total inválido.')
            parsed=urllib.parse.urlsplit(url)
            if parsed.scheme!='https' or parsed.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com') or parsed.username or parsed.password:raise SystemExit('Origem não autorizada.')
          if not {f'Bin-Race-3-Setup-{version}.exe',f'Bin-Race-3-Update-{version}.json','Bin-Race-3-SHA256SUMS.txt'}<=names:raise SystemExit('Faltam arquivos obrigatórios.')
          for item in bundle:
            digest=hashlib.sha256();received=0;prefix=b''
            try:
              with urllib.request.urlopen(item['url'],timeout=60) as response,open(item['name'],'wb') as output:
                final=urllib.parse.urlsplit(response.geturl())
                if final.scheme!='https' or final.hostname not in ('release-assets.githubusercontent.com','objects.githubusercontent.com'):raise ValueError('Origem final inválida.')
                while True:
                  chunk=response.read(1024*1024)
                  if not chunk:break
                  received+=len(chunk)
                  if received>item['size']:raise ValueError('Tamanho excedido.')
                  if len(prefix)<2:prefix=(prefix+chunk)[:2]
                  output.write(chunk);digest.update(chunk)
            except Exception:raise SystemExit('Falha no download temporário. Gere nova publicação.')
            if received!=item['size'] or digest.hexdigest()!=item['sha256'] or (item['name'].endswith('.exe') and prefix!=b'MZ'):raise SystemExit('Integridade inválida.')
            print(f"Verificado: {item['name']}, {received} bytes.")
          sums={line.split('  ',1)[1]:line.split('  ',1)[0] for line in open('Bin-Race-3-SHA256SUMS.txt').read().splitlines()}
          if sums!={item['name']:item['sha256'] for item in bundle if item['name']!='Bin-Race-3-SHA256SUMS.txt'}:raise SystemExit('Inventário de hashes divergente.')
          PY
      - name: Publicar arquivos de atualização
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Bin Race 3 0.7.4 — atualização ao abrir, seleção explícita e análise de treino.

          Busca atualizações em segundo plano ao abrir o aplicativo instalado. Quando houver versão nova, mostra as mudanças e oferece Atualizar agora ou Agora não. Não baixa antes do aceite, aguarda outras janelas e funciona offline. Ao adiar, oferece novamente na próxima abertura. Mantém atualização incremental, verificação SHA-256, preparação, substituição, recuperação e reabertura automática.

          Volta ideal em etapas: escolha manualmente sessões e voltas, defina a base GPS e confirme o cálculo. O conjunto começa vazio a cada reabertura da área; a seleção A/B não inclui arquivos na ideal. Resultados, plano manual e meta extra ficam separados. O plano usa os melhores setores escolhidos, com origem, diferenças e acumulados; navegar entre suas etapas preserva o plano enquanto os dados não mudarem.

          Em Replay e setores, a aba Grupos A/B permite escolher baterias de sessões, comparar a melhor volta real de cada grupo com gaps por setor/acumulados e abrir o par no relatório por curva. Não há inclusão automática por nome ou dia. Comparação livre de voltas, inclusive entre arquivos, continua disponível.

          Layout para notebooks com controles acessíveis e listas/tabelas em áreas internas. Biblioteca destaca melhor volta, piloto e data, com ordenação por tempo ou dia. Importações continuam exigindo identificação; limpar análise mantém os treinos no banco local.

          Plano e relatório oferecem um cenário local de retomada antecipada quando os dados permitem. Aceleração constante e outras hipóteses são mostradas; o resultado não é previsão nem modifica a ideal observada. Sem integração com IA externa ou envio de telemetria. GPS não mede freio/acelerador nem comprova causa da perda.

          A versão 0.7.3 precisa de uma atualização manual pelo botão existente para receber a busca automática ao abrir. Pacote por arquivos para bases compatíveis desde 0.7.2; sem base compatível, usa completo. Arquivos alterados são baixados inteiros; motor igual é preservado. Sem certificado público novo: avisos do Windows podem permanecer. SOLO 2 Wi-Fi continua; envio de traçados/configuração segue pelo Race Studio.

          Para a primeira instalação, baixe Bin-Race-3-Setup-0.7.4.exe. Pacotes Update são usados pelo aplicativo; o catálogo JSON não é um instalador. Código-fonte e arquivos de telemetria permanecem privados.
          NOTES
          gh release create "v$APP_VERSION" Bin-Race-3-*.exe Bin-Race-3-Update-*.json Bin-Race-3-SHA256SUMS.txt --repo "$GH_REPO" --title "Bin Race 3 $APP_VERSION" --notes-file notes.md
